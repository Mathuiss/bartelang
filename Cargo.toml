[package]
name = "bartelang"
version = "1.1.0"
edition = "2024"
description = "Bartelang: a 1998 Visual Basic 6 dialect with a Unix stream-processing engine"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Mathuiss/bartelang"
keywords = ["vb6", "visual-basic", "interpreter", "scripting", "unix"]
categories = [
    "command-line-utilities",
    "development-tools",
    "parser-implementations",
    "text-processing",
]

[dependencies]
# The CLI: argument parsing, --help and usage errors.
clap = { version = "4.6.7", features = ["wrap_help"] }

# The HTTP object: the interpreter does the request natively, from safe Rust.
# 0.13 defaults to rustls (with the platform trust store), so building no
# longer needs OpenSSL on the system.
reqwest = { version = "0.13.5", features = ["blocking"] }

# `VBScript.RegExp`.
regex = "1"

# Used for the default SIGPIPE disposition (so `bartelang run x.btm | head`
# exits quietly the way every other Unix tool does) and for local wall-clock
# time, which std cannot do on its own.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "bartelang"
path = "src/main.rs"
